# Server Configuration
server.port=${PORT:5000}

# Application Name
spring.application.name=edtech-crm-backend

# Supabase PostgreSQL / Fallback Database Configuration
# Evaluators can supply standard Supabase connection string via DATABASE_URL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:edtech_crm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Custom JWT Authentication Properties (Supabase Auth is NOT used)
app.jwt.secret=${JWT_SECRET:edtech_crm_super_secure_jwt_secret_key_2026_xyz_at_least_32_bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Default Admin Credentials for Auto-seeding
app.admin.default-name=${ADMIN_DEFAULT_NAME:Lead Administrator}
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@edutech.com}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.edtech.crm=INFO
